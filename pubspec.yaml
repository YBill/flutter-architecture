name: novelverse
description: "Novelverse Android and iOS application."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.11.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.1
  intl: ^0.20.3
  json_annotation: ^4.12.0
  logger: ^2.8.0
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.6
  characters: ^1.4.1
  scrollable_positioned_list: ^0.3.8
  crypto: ^3.0.7
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  flutter_lints: ^6.0.0
  json_serializable: ^6.15.2
  riverpod_generator: ^4.0.9
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  generate: true
